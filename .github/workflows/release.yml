  windows:
    name: Windows Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Windows application
        run: dotnet publish windows/Watchly -c Release -r win-x64 --self-contained -o windows/dist

      - name: Build installer
        shell: bash
        run: |
          choco install innosetup --no-progress -y > /dev/null

          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /DAppVersion=${TAG#v} windows/installer/Watchly.iss

          mkdir -p out

          cp windows/installer/Output/Watchly-Setup-${TAG#v}-x64.exe \
            "out/Watchly-windows-$TAG-x64-setup.exe"

          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/*.exe
          if-no-files-found: error
