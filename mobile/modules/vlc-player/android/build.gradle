plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vlcplayer'
version = '0.1.0'

android {
  namespace "expo.modules.vlcplayer"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // libVLC carries its own decoders, which is the whole point: Media3 defers to
  // the platform MediaCodec for AC3/E-AC3/DTS, and most Android devices ship no
  // decoder for them, so those files play as video with silence. VLC also
  // renders bitmap subtitles (PGS, VOBSUB) that Media3 cannot.
  // ~38-50MB of native code per ABI — the reason app/build.gradle splits by ABI.
  implementation 'org.videolan.android:libvlc-all:3.6.3'
}
